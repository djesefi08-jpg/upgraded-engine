<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a3a;--mute:#5d6b7a;--line:#dde2e0;--acc:#1b7f55;--acc-ink:#fff;--sun:#c9a45c;--danger:#b3382c;

:root[data-theme="dark"]{--bg:#12181f;--card:#1b242d;--ink:#eef2f1;--mute:#9aa8b4;--line:#2b3742;--acc:#4fc08f;--acc-ink:#0d1a16;--sun:#d4b06a;--danger:#e57a6d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar{max-width:1000px;margin:auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.logo{font-weight:800;font-size:1.05rem;text-decoration:none;color:var(--ink);margin-right:auto}
.logo span{background:var(--sun);color:#1d2a3a;padding:0 8px;border-radius:6px;margin-right:4px}
.bar{flex-wrap:wrap;row-gap:4px}.logo{display:flex;align-items:center;gap:8px;color:var(--acc)}.logo b{font-size:.95rem;letter-spacing:.02em}.logo img{border-radius:50%;background:#f7f7f3;object-fit:cover}
.hero{background:#f7f7f3;border-radius:16px;text-align:center;padding:8px;margin-bottom:14px;border:1px solid var(--sun)}.hero img{width:70%;max-width:280px;height:auto;display:block;margin:auto}
footer{max-width:1000px;margin:24px auto 0;padding:16px;border-top:1px solid var(--line);text-align:center;color:var(--mute)}footer a{color:var(--acc);font-weight:600}
.nav a{color:var(--ink);text-decoration:none;font-weight:600;padding:8px 10px;border-radius:8px}
.nav a:hover,.nav a:focus-visible{background:var(--line)}
.badge{background:var(--acc);color:var(--acc-ink);border-radius:99px;padding:1px 8px;font-size:.8rem;margin-left:4px}
main{max-width:1000px;margin:auto;padding:16px}
h1{font-size:1.7rem;margin:.2em 0 .6em}h2{font-size:1.2rem}
.filters{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:16px}
@media(min-width:640px){.filters{grid-template-columns:2fr 1fr 1fr 1fr}}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card a.pic{text-decoration:none}
.pic{display:flex;align-items:center;justify-content:center;aspect-ratio:1;font-size:4rem;background:var(--line);overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.card .body{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.cat{color:var(--mute);font-size:.8rem}
.price{font-weight:800;font-size:1.1rem}
.btn{border:0;background:var(--acc);color:var(--acc-ink);padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.del{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.sm{padding:6px 10px;font-size:.9rem}
.mt{margin-top:auto}
.detail{display:grid;gap:16px}
@media(min-width:700px){.detail{grid-template-columns:1fr 1fr}}
.detail .pic{border-radius:14px;font-size:8rem}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.row .pic{width:64px;height:64px;aspect-ratio:auto;font-size:2rem;border-radius:8px;flex:none}
.row .grow{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:800;padding:12px 0}
form.f{display:grid;gap:10px;max-width:520px}
label{font-weight:600;font-size:.9rem;display:grid;gap:4px}
.muted{color:var(--mute)}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1}
.ok{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center}
.tag{display:inline-block;background:var(--sun);color:#1d2a3a;border-radius:6px;padding:2px 8px;font-size:.8rem;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20}
.actions{display:flex;gap:6px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

 <div class="filters">

 <div class="grid" id="grid">${grid(list)}</div>`;
 const upd=()=>{F={q:$("#fq").value,cat:$("#fc").value,min:$("#fmin").value,max:$("#fmax").value};
  $("#grid").innerHTML=grid(S.products.filter(p=>(!F.q||(p.name+p.desc).toLowerCase().includes(F.q.toLowerCase()))&&(!F.cat||p.cat===F.cat)&&(F.min===""||p.price>=+F.min)&&(F.max===""||p.price<=+F.max)))};
 ["fq","fc","fmin","fmax"].forEach(i=>$("#"+i).addEventListener("input",upd));
}
function grid(list){return list.length?list.map(p=>`<div class="card"><a class="pic" href="#/p/${p.id}" aria-label="Voir ${esc(p.name)}">${pic(p).replace('<div class="pic">','<div class="pic" style="width:100%">')}</a><div class="body"><span class="cat">${esc(p.cat)}</span><strong>${esc(p.name)}</strong><span class="price">${eur(p.price)}</span><button class="btn mt" data-add="${p.id}">Ajouter au panier</button></div></div>`).join(""):`<p class="empty" style="grid-column:1/-1">Aucun produit ne correspond. Modifiez vos filtres.</p>`}

function product(id){
 const p=S.products.find(x=>x.id==id);if(!p){return location.hash="#/"}
 $("#app").innerHTML=`<p><a href="#/">Retour à la boutique</a></p><div class="detail">${pic(p)}<div><span class="tag">${esc(p.cat)}</span><h1>${esc(p.name)}</h1><p class="price" style="font-size:1.6rem">${eur(p.price)}</p><p>${esc(p.desc)}</p><button class="btn" data-add="${p.id}">Ajouter au panier</button></div></div>`;
}
function cart(){
 const it=cartItems();
 if(!it.length){$("#app").innerHTML=`<h1>Panier</h1><p class="empty">Votre panier est vide.<br><br><a class="btn" href="#/">Voir les produits</a></p>`;return}
 $("#app").innerHTML=`<h1>Panier</h1>${it.map(({p,q})=>`<div class="row">${pic(p)}<div class="grow"><strong>${esc(p.name)}</strong><div class="muted">${eur(p.price)}</div></div><div class="qty"><button data-d="${p.id}" aria-label="Retirer une unité">−</button><span>${q}</span><button data-add="${p.id}" data-quiet="1" aria-label="Ajouter une unité">+</button></div><button class="btn del sm" data-rm="${p.id}">Retirer</button></div>`).join("")}
 <div class="total"><span>Total</span><span>${eur(total())}</span></div><a class="btn" href="#/commande">Passer commande</a>`;
}
function checkout(){
 if(!count()){return location.hash="#/panier"}
 $("#app").innerHTML=`<h1>Commande</h1><form class="f" id="co">
 <label>Nom complet<input name="nom" required autocomplete="name"></label>
 <label>Adresse de livraison<textarea name="adr" rows="3" required autocomplete="street-address"></textarea></label>
 <label>Téléphone<input name="tel" type="tel" required autocomplete="tel" pattern="[0-9 +().-]{6,}"></label>
 <div class="total"><span>Total à payer</span><span>${eur(total())}</span></div>
 <p class="muted">Le paiement se fait à l'étape suivante.</p>
 <button class="btn" type="submit">Confirmer la commande</button></form>`;
 $("#co").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target),b=e.target.querySelector("button");b.disabled=true;
  try{const d=await api("/api/checkout","POST",{nom:f.get("nom"),adr:f.get("adr"),tel:f.get("tel"),items:Object.entries(S.cart).map(([id,q])=>({id:+id,q}))});
   if(d.url){location.href=d.url}else{location.hash="#/ok/"+d.id}}
  catch(err){toast(err.message);b.disabled=false}});
}
function done(id){S.cart={};save();$("#cnt").textContent=0;
 $("#app").innerHTML=`<div class="ok"><h1>Merci pour votre commande !</h1><p>Commande n° <strong>${esc(id)}</strong> enregistrée.</p><a class="btn" href="#/">Continuer mes achats</a></div>`}
async function vendor(tab="produits"){

 const e=editing!==null?(S.products.find(p=>p.id===editing)||{}):{};

 if($("#cx"))$("#cx").onclick=()=>{editing=null;vendor()};
 $("#pf").addEventListener("submit",ev=>{ev.preventDefault();const f=new FormData(ev.target);
  const send=async img=>{const d={name:f.get("name"),price:+f.get("price"),cat:f.get("cat"),emoji:f.get("emoji"),desc:f.get("desc")};if(img)d.img=img;
   try{await api(e.id?"/api/products/"+e.id:"/api/products",e.id?"PUT":"POST",d);editing=null;toast("Enregistré");await load()}catch(err){toast(err.message)}};
  const file=f.get("img");
  if(file&&file.size){if(file.size>400000){toast("Image trop lourde (max 400 Ko)");return}const r=new FileReader();r.onload=()=>send(r.result);r.readAsDataURL(file)}else send("")});
}

document.addEventListener("click",ev=>{
 const t=ev.target.closest("[data-add],[data-d],[data-rm],[data-tab],[data-edit],[data-del]");if(!t)return;
 const g=k=>t.dataset[k];
 if(g("add")){add(g("add"));if(!g("quiet"))toast("Ajouté au panier");render()}
 else if(g("d")){add(g("d"),-1);render()}
 else if(g("rm")){delete S.cart[g("rm")];save();render()}
 else if(g("tab")){vendor(g("tab"))}
 else if(g("edit")){editing=+g("edit");vendor();scrollTo(0,0)}
 else if(g("del")){if(confirm("Supprimer ce produit ?"))api("/api/products/"+g("del"),"DELETE").then(load).catch(x=>toast(x.message))}
});
function render(){
 const h=location.hash.replace(/^#\/?/,"").split("/");
 $("#cnt").textContent=count();
 if(h[0]==="p")product(h[1]);else if(h[0]==="panier")cart();else if(h[0]==="commande")checkout();else if(h[0]==="ok")done(h[1]);else if(h[0]==="vendeur")vendor();else home();
}
window.addEventListener("hashchange",()=>{render();scrollTo(0,0)});
load();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
