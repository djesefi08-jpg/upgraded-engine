<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Boîte de Réception - Vendeur</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        .message-card { background: #fff; border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .message-card h4 { margin: 0 0 5px 0; color: #007bff; }
        .date { font-size: 12px; color: gray; }
        #loginSection, #inboxSection { margin-top: 20px; }
        .hidden { display: none; }
        input, button { padding: 10px; margin: 5px 0; }
        button { background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>Espace Privé - Boîte de Réception</h2>

    <!-- Section Connexion -->
    <div id="loginSection">
        <p>Veuillez entrer votre mot de passe vendeur pour lire les messages :</p>
        <input type="password" id="passwordInput" placeholder="Mot de passe">
        <button onclick="chargerMessages()">Se connecter</button>
        <p id="errorMsg" style="color: red;"></p>
    </div>

    <!-- Section Messages (Cachée par défaut) -->
    <div id="inboxSection" class="hidden">
        <h3>Messages reçus</h3>
        <div id="messagesList">Chargement...</div>
    </div>
</div>

<script>
    async function chargerMessages() {
        const password = document.getElementById('passwordInput').value;
        const errorMsg = document.getElementById('errorMsg');
        const inboxSection = document.getElementById('inboxSection');
        const loginSection = document.getElementById('loginSection');
        const messagesList = document.getElementById('messagesList');

        try {
            const response = await fetch('/api/messages', {
                headers: { 'x-seller-password': password }
            });

            if (!response.ok) {
                throw new Error("Mot de passe incorrect ou accès refusé.");
            }

            const messages = await response.json();
            
            // Afficher la section des messages et masquer la connexion
            loginSection.classList.add('hidden');
            inboxSection.classList.remove('hidden');

            if (messages.length === 0) {
                messagesList.innerHTML = "<p>Aucun message pour le moment.</p>";
                return;
            }

            messagesList.innerHTML = messages.map(msg => `
                <div class="message-card">
                    <h4>De : ${msg.nom} (${msg.email})</h4>
                    <p>${msg.message}</p>
                    <span class="date">Reçu le : ${msg.date}</span>
                </div>
            `).join('');

        } catch (err) {
            errorMsg.textContent = err.message;
        }
    }
</script>

</body>
</html>
